name: GlassOS launcher (APK)

on:
  push:
    paths:
      - 'glass/**'
      - 'launcher/**'
      - '.github/workflows/glassos-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        run: gradle -p launcher assembleRelease --no-daemon --stacktrace

      - name: Prepara file
        run: cp launcher/app/build/outputs/apk/release/app-release.apk GlassOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassOS-apk
          path: GlassOS.apk

      - name: Pubblica nella release "glassos-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glassos-latest
          name: GlassOS — launcher stile iPhone
          target_commitish: ${{ github.sha }}
          files: GlassOS.apk
          body: |
            Scarica **GlassOS.apk** dal telefono Android e installalo.
            Poi: Impostazioni › App › App predefinite › App Home › **GlassOS**.
            Build ${{ github.run_number }} dal commit ${{ github.sha }}.
